name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a GitHub release with this tag (e.g. v0.1.1); leave empty to only build"
        required: false
        default: ""

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  AHK_VERSION: "2.0.19"
  # SHA-256 of AutoHotkey_2.0.19.zip from the official GitHub release.
  AHK_SHA256: "4E0D0E65655066A646A210951320FEAEF0729A3597177131ADAEC4066BEF5869"

jobs:
  core:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  windows:
    name: Windows build, end-to-end tests, installer
    runs-on: windows-latest
    permissions:
      contents: write # only used to publish releases for v* tags
    env:
      # Code signing turns on when its credentials exist (see docs/SIGNING.md).
      AZURE_SIGNING: ${{ secrets.AZURE_CLIENT_SECRET != '' && vars.TRUSTED_SIGNING_ACCOUNT != '' }}
      PFX_SIGNING: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Fetch AutoHotkey v2
        shell: pwsh
        run: |
          $zip = "AutoHotkey_$env:AHK_VERSION.zip"
          Invoke-WebRequest "https://github.com/AutoHotkey/AutoHotkey/releases/download/v$env:AHK_VERSION/$zip" -OutFile ahk.zip
          $hash = (Get-FileHash ahk.zip -Algorithm SHA256).Hash
          if ($hash -ne $env:AHK_SHA256) { throw "AutoHotkey download hash $hash does not match the pinned $env:AHK_SHA256" }
          Expand-Archive ahk.zip -DestinationPath ahk
          $exe = Get-ChildItem ahk -Recurse -Filter AutoHotkey64.exe | Select-Object -First 1
          Copy-Item $exe.FullName src-tauri/resources/engine/AutoHotkey64.exe
          Get-ChildItem ahk -Recurse -Filter license.txt | Select-Object -First 1 | Copy-Item -Destination src-tauri/resources/engine/AutoHotkey-license.txt
          "KEYFORGE_AHK=$PWD\src-tauri\resources\engine\AutoHotkey64.exe" >> $env:GITHUB_ENV

      - name: Unit and end-to-end tests (real AutoHotkey, injected keys)
        env:
          KEYFORGE_REQUIRE_E2E: "1"
        run: cargo test --no-fail-fast -p keyforge-core -p keyforge-engine -- --test-threads=1 --nocapture

      - run: npm ci

      - name: Prepare code signing (Azure Trusted Signing)
        if: env.AZURE_SIGNING == 'true'
        shell: pwsh
        env:
          ENDPOINT: ${{ vars.TRUSTED_SIGNING_ENDPOINT }}
          ACCOUNT: ${{ vars.TRUSTED_SIGNING_ACCOUNT }}
          PROFILE: ${{ vars.TRUSTED_SIGNING_PROFILE }}
        run: |
          cargo install trusted-signing-cli --locked
          $cmd = "trusted-signing-cli -e $env:ENDPOINT -a $env:ACCOUNT -c $env:PROFILE -d KeyForge %1"
          @{ bundle = @{ windows = @{ signCommand = $cmd } } } | ConvertTo-Json -Depth 5 | Set-Content signing.json

      - name: Prepare code signing (certificate file)
        if: env.AZURE_SIGNING != 'true' && env.PFX_SIGNING == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cert.pfx", [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath "$env:RUNNER_TEMP\cert.pfx" -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item "$env:RUNNER_TEMP\cert.pfx"
          @{ bundle = @{ windows = @{ certificateThumbprint = $cert.Thumbprint; digestAlgorithm = "sha256"; timestampUrl = "http://timestamp.digicert.com" } } } | ConvertTo-Json -Depth 5 | Set-Content signing.json

      - name: Build app and NSIS installer
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        shell: pwsh
        run: |
          if (Test-Path signing.json) { npx tauri build --config signing.json } else { npx tauri build }
          if ($LASTEXITCODE -ne 0) { throw "tauri build failed" }

      - name: Smoke test the release build (window renders, no startup errors)
        shell: pwsh
        run: |
          $env:KEYFORGE_REMOTE_DEBUG_PORT = "9222"
          $p = Start-Process target/release/keyforge.exe -PassThru
          try {
            node scripts/smoke-ui.mjs smoke.png
            if ($LASTEXITCODE -ne 0) { throw "UI smoke test failed" }
            if ($p.HasExited) { throw "KeyForge exited during startup with code $($p.ExitCode)" }
          } finally {
            if (-not $p.HasExited) { Stop-Process -Id $p.Id }
          }

      - name: Check signatures and write checksums
        shell: pwsh
        run: |
          $installer = Get-ChildItem target/release/bundle/nsis -Filter *.exe | Select-Object -First 1
          foreach ($file in @("target/release/keyforge.exe", $installer.FullName)) {
            $sig = Get-AuthenticodeSignature $file
            "{0}: {1} {2}" -f (Split-Path $file -Leaf), $sig.Status, $sig.SignerCertificate.Subject
            if ((Test-Path signing.json) -and $sig.Status -ne "Valid") { throw "$file is not validly signed" }
          }
          if (-not (Test-Path signing.json)) { "::warning::The installer is not code-signed, so browsers and SmartScreen will warn. See docs/SIGNING.md." }
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($installer.Name)" | Set-Content -NoNewline -Encoding ascii target/release/bundle/nsis/SHA256SUMS.txt
          "SHA-256 $hash  $($installer.Name)"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshot
          path: smoke.png
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: keyforge-windows-installer
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish release (v* tags, or a manual run with release_tag)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: KeyForge ${{ inputs.release_tag || github.ref_name }}
          files: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/SHA256SUMS.txt
          generate_release_notes: true
